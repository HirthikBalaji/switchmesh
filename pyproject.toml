[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "switchmesh"
version = "1.0.0"
description = "Sovereign Human-Agent Mesh with Ephemeral Verification Sandboxes & Dual-Custody Gates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "textual>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
switchmesh = "demo:main"

[tool.pytest.ini_options]
testpaths = ["tests", "core_contribution/tests"]
python_files = ["test_*.py"]
