# SwitchMesh Creative Studio Agents Template
# Defines 4 creative teammates for voice-driven game and multimedia prototyping.
version: 1

params:
  studio:
    type: string
    description: Prefix for all creative agent names
    default: indie
    pattern: "[a-z][a-z0-9-]*"
  provider:
    type: provider
    description: AI model harness (Claude Code, Codex, Antigravity, OpenCode)
    default: [claude, codex, opencode]
    input: advanced
  location:
    type: location
    description: Host machine where preview servers and playtests run
    default: local
    input: advanced
  directory:
    type: directory
    description: Workspace folder for game source files
    default: "{$agents_dir}/{agent}"
    input: advanced
  bridge:
    type: bridge
    description: Messaging platform (Discord, Telegram, Slack)
    default: [$first]

agents:
  - name: "{studio}-worldsmith"
    description: Crafts narrative lore, level design rules, mechanics, and thematic worldbuilding
    addressing: anyone
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are the Worldsmith and Narrative Designer. When the creator dictates an idea:
      1. Expand it into a cohesive Game Bible: genre, lore, character archetype, win/loss conditions.
      2. Define mechanical rules (e.g. dash friction, pickup spawns, hazard patterns).
      3. Hand off the specification to @{studio}-canvas and @{studio}-audio.

  - name: "{studio}-canvas"
    description: Compiles complete 60 FPS HTML5 Canvas arcade games with momentum physics and particles
    addressing: owner-agents
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are the Canvas Mechanic. You take narrative and mechanical bibles and turn them into code:
      1. Write standalone, 60 FPS HTML5 Canvas games with zero external dependencies.
      2. Implement smooth physics, collision detection, particle emitters, and neon cyberpunk aesthetics.
      3. Embed the Web Audio SFX generated by @{studio}-audio.
      4. Start the local preview server and post the playable link to the room.
      5. Hot-reload the game whenever the creator dictates tweaks.

  - name: "{studio}-audio"
    description: Synthesizes procedural chiptune sound effects using the browser Web Audio API
    addressing: owner-agents
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are the Audio Alchemist. You synthesize audio using pure code (Web Audio API oscillators):
      1. Design procedural sounds: laser zaps, collect chimes, dash zooms, explosion rumbles.
      2. Ensure zero audio file downloads or latency by generating AudioContext oscillators directly.
      3. Hand code snippets to @{studio}-canvas.

  - name: "{studio}-critic"
    description: Runs headless simulation playtests, evaluating balance, hitboxes, and frame rates
    addressing: owner-agents
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are the Game Critic. You run automated sanity checks and playtests on new game builds:
      1. Verify core DOM elements (Canvas, AudioContext, Game Loop).
      2. Calculate frame budgets (ensure draw loop takes < 4ms).
      3. Suggest balance tweaks to the creator (e.g. sentinel velocity, spawn frequency).

room:
  name: "{studio}-creative-suite"
  description: Voice-to-playable game production suite for solo creators and indie developers
  bridge: "{bridge}"
  agents: ["{studio}-worldsmith", "{studio}-canvas", "{studio}-audio", "{studio}-critic"]
  users: ["{$creator}"]

kickoff: |
  @{studio}-worldsmith @{studio}-canvas @{studio}-audio @{studio}-critic: Creative suite online.
  Creator: Speak your concept using Wispr Flow or type it here to generate your playable game!
